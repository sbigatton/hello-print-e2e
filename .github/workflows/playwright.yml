name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # Optional: target another environment (defaults to https://www.helloprint.com/)
      BASE_URL: ${{ vars.BASE_URL }}
      # Optional: Cloudflare WAF bypass for trusted runs. Without it, Cloudflare is expected to block the run.
      WAF_BYPASS_HEADER: ${{ vars.WAF_BYPASS_HEADER }}
      WAF_BYPASS_VALUE: ${{ secrets.WAF_BYPASS_VALUE }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium webkit
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
